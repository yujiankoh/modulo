<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MODULO</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Identity Services: the library that runs the sign-in popup -->
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <!-- Heading + Sign in portion -->
  <h1>MODULO</h1>
  <button id="connectBtn">Connect Google Drive</button>
  <button id="localBtn">Use this device only</button>
  <p id="status">Not connected</p>

  <!-- Timetable parsing portion -->
  <hr />
  <h2>Timetable</h2>
  <label for="eduLevel">Education level:</label>
  <select id="eduLevel">
    <option value="">— select —</option>
    <option value="primary">Primary school</option>
    <option value="secondary">Secondary school</option>
    <option value="jc">Junior College</option>
    <option value="poly">Polytechnic</option>
    <option value="university">University</option>
  </select>
  <br />
  <input id="timetableImage" type="file" accept="image/*" />
  <br />
  <img id="timetablePreview" alt="preview" style="max-width: 400px; display: none;" />
  <br />
  <button id="parseBtn">Parse timetable</button>
  <button id="addWeekBtn">Add another week</button>
  <pre id="parseOutput"></pre>

  <!-- Read-only display of the saved timetable; refreshed on save/parse/load. -->
  <div id="timetableDisplay"></div>

  <!-- Phase 6: weekly calendar grid view of the timetable. -->
  <div id="timetableViewHeader"></div>
  <div id="timetableCalendar"></div>

  <!-- Manual timetable editor (Phase 5): opens to CORRECT a parsed timetable, or to
       ENTER one by hand when parsing fails / there's no photo. JS fills #moduleList. -->
  <button id="manualEntryBtn">Enter / edit timetable manually</button>

  <div id="timetableEditor" style="display: none;">
    <h3>Edit timetable</h3>
    <p id="editorHint">Add your modules and their class slots, then Save.</p>
    <div id="moduleList"></div>
    <button id="addModuleBtn">+ Add module</button>
    <div>
      <button id="saveTimetableBtn">Save timetable</button>
      <button id="closeEditorBtn">Close</button>
      <span id="editorStatus"></span>
    </div>
  </div>

  <!-- Task adding portion -->
  <hr />
  <h2>Tasks</h2>
  <input id="taskTitle" type="text" placeholder="Task title (e.g. CS1101S tutorial)" />
  <input id="taskDue" type="date" />
  <select id="taskType">
    <option value="assignment">Assignment</option>
    <option value="tutorial">Tutorial</option>
    <option value="quiz">Quiz</option>
    <option value="exam">Exam</option>
  </select>
  <button id="addBtn">Add Task</button>
  <button id="reloadBtn">Reload from Drive</button>
  <ul id="taskList"></ul>
  <script type="module" src="main.js"></script>
</body>
</html>
